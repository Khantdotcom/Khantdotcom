name: Generate GitHub Metrics
on:
  schedule:
    - cron: "0 0 * * *" # Updates daily at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Isometric Commit Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Notable Contributions (Indepth)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.notable.indepth.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_notable: yes
          plugin_notable_indepth: yes
          plugin_notable_repositories: yes
  # 1. FILTER BY CONTRIBUTION TYPE (comma-separated)
          # Options: commit, pull_request, issue
          plugin_notable_types: commit, pull_request, issue
          
          # 2. FILTER BY REPOSITORY OWNER
          # Options: organization (default), user, all
          plugin_notable_from: organization
          
          # 3. FILTER BY POPULARITY (GitHub search syntax)
          # Example: Only show repositories with more than 50 stars          
          # 4. HIDE SPECIFIC REPOSITORIES (comma-separated)
          # Replace with actual repository names you want to hide
          plugin_notable_skipped: firstcontributions/first-contributions, MegaWiz-Dev-Team/agentic_rag_workshop, ye-kyaw-thu/AIE-F-B2, Greenstand/treetracker-wallet-app, terminal-42s/42_examshell, 247chan/teahouse-backend, ye-kyaw-thu/AIE-F, P-nut-design/Rush02
      - name: LeetCode Stats
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.leetcode.svg
          token: NOT_NEEDED
          base: ""
          plugin_leetcode: yes
          plugin_leetcode_user: khantdotcom
          plugin_leetcode_sections: solved, skills, recent
